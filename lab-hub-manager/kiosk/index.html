<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>L.A.B</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a0c14'/><rect x='9' y='9' width='14' height='14' fill='none' stroke='%23ffcf6f' stroke-width='2'/></svg>">
<style>
  :root{--bg:#0a0c14;--txt:#f3f5fb;--txt2:#9aa4bd;--stroke:rgba(255,255,255,.09);--panel:rgba(255,255,255,.045);--warm:#ffcf6f;--warm2:#ff9d5c;--cool:#6fb4ff;--ok:#5fe08a}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden}
  body{font-family:"Segoe UI",Inter,system-ui,sans-serif;color:var(--txt);
    background:radial-gradient(1200px 800px at 80% -10%,#2a2140 0,#0a0c14 60%),var(--bg);
    display:flex;flex-direction:column;padding:min(4vw,44px);gap:min(3vh,28px)}
  .top{display:flex;justify-content:space-between;align-items:flex-start}
  .greet{font-size:clamp(20px,3.2vw,34px);font-weight:700}
  .greet .s{font-size:clamp(12px,1.4vw,15px);color:var(--txt2);font-weight:500;margin-top:4px;letter-spacing:.5px}
  .conn{display:flex;align-items:center;gap:9px;font-size:clamp(11px,1.2vw,13px);color:var(--txt2);letter-spacing:1.5px;text-transform:uppercase}
  .conn i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);animation:bp 3s ease-in-out infinite}
  @keyframes bp{0%,100%{opacity:1}50%{opacity:.4}}
  .clockwrap{display:flex;align-items:baseline;gap:min(3vw,30px);flex-wrap:wrap}
  .clock{font-size:clamp(84px,17vw,220px);font-weight:800;letter-spacing:-4px;line-height:.9;font-variant-numeric:tabular-nums}
  .clock .ampm{font-size:.32em;color:var(--txt2);font-weight:700;letter-spacing:0}
  .date{font-size:clamp(16px,2vw,26px);color:var(--txt2);font-weight:600}
  .house{flex:1;display:flex;flex-direction:column;gap:min(2vh,16px);min-height:0}
  .h-lbl{font-size:clamp(11px,1.2vw,13px);letter-spacing:2.5px;text-transform:uppercase;color:var(--txt2);font-weight:700}
  .rooms{display:grid;grid-template-columns:repeat(5,1fr);gap:min(2vw,18px);flex:1;min-height:0}
  @media(max-width:820px){.rooms{grid-template-columns:repeat(3,1fr)}}
  .room{border:1px solid var(--stroke);background:var(--panel);border-radius:22px;padding:min(2.4vw,24px);
    display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:.25s;position:relative;overflow:hidden;min-height:120px}
  .room .bulb{width:clamp(34px,4vw,48px);height:clamp(34px,4vw,48px);color:var(--txt2);transition:.25s}
  .room .nm{font-size:clamp(15px,1.7vw,21px);font-weight:700}
  .room .state{font-size:clamp(11px,1.2vw,13px);letter-spacing:1.5px;text-transform:uppercase;color:var(--txt2);margin-top:4px}
  .room.on{background:linear-gradient(160deg,rgba(255,207,111,.20),rgba(255,157,92,.07));border-color:rgba(255,207,111,.4)}
  .room.on .bulb{color:var(--warm);filter:drop-shadow(0 0 14px rgba(255,207,111,.6))}
  .room.on .state{color:var(--warm)}
  .room.on::after{content:'';position:absolute;inset:0;background:radial-gradient(140px 90px at 30% 20%,rgba(255,207,111,.16),transparent 70%);pointer-events:none}
  .room:active{transform:scale(.97)}
  .strip{display:flex;gap:min(2vw,18px);flex-wrap:wrap}
  .stat{flex:1;min-width:150px;border:1px solid var(--stroke);background:var(--panel);border-radius:18px;padding:min(2vw,20px) min(2.4vw,24px);display:flex;align-items:center;gap:16px}
  .stat .ic{width:clamp(26px,3vw,34px);height:clamp(26px,3vw,34px);color:var(--cool);flex:none}
  .stat .v{font-size:clamp(20px,2.4vw,30px);font-weight:800;line-height:1}
  .stat .k{font-size:clamp(10px,1.1vw,12px);letter-spacing:1.5px;text-transform:uppercase;color:var(--txt2);margin-top:4px}
  .stat.warm .ic{color:var(--warm)}.stat.ok .ic{color:var(--ok)}.stat.pur .ic{color:#b79bff}
</style>
</head>
<body>
  <div class="top">
    <div><div class="greet" id="greet">Hello</div><div class="s" id="sub">The L.A.B</div></div>
    <div class="conn"><i id="dot"></i><span id="node">connecting</span></div>
  </div>

  <div class="clockwrap">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date">—</div>
  </div>

  <div class="house">
    <div class="h-lbl">The House · tap to switch a room</div>
    <div class="rooms" id="rooms"></div>
  </div>

  <div class="strip" id="strip"></div>

  <style>
    .panels{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 28px 28px}
    @media (max-width:820px){.panels{grid-template-columns:1fr}}
    .panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:18px 20px}
    .panel .h-lbl{margin:0 0 10px}
    .kev{display:flex;gap:14px;align-items:baseline;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:17px}
    .kev:last-child{border-bottom:0}
    .kev .d{font-family:"Cascadia Code",Consolas,monospace;font-size:13px;opacity:.65;min-width:96px}
    .kev i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px}
    .kmem{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)}
    .kmem:last-child{border-bottom:0}
    .kmem .av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
    .kmem .bar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.07);margin-top:6px}
    .kmem .bar i{display:block;height:100%}
    .kempty{opacity:.55;font-size:15px;padding:6px 0}
  </style>
  <div class="panels">
    <div class="panel"><div class="h-lbl">Coming up · next 7 days</div><div id="k-up"><div class="kempty">…</div></div></div>
    <div class="panel"><div class="h-lbl">This week · who's sharing</div><div id="k-week"><div class="kempty">…</div></div></div>
    <div class="panel" style="grid-column:1/-1"><div class="h-lbl">Ask The Sauce</div>
      <form id="k-sq" style="display:flex;gap:10px"><input id="k-sqin" placeholder="What's on tonight? · add milk to the list · lights off in the lounge" maxlength="500" style="flex:1;min-width:0;font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.25);color:inherit"><button style="font:inherit;font-size:16px;font-weight:700;padding:14px 22px;border-radius:14px;border:0;background:linear-gradient(135deg,#9a86ff,#ff9e6b);color:#0a0c14">Ask</button></form>
      <div id="k-sqout" style="margin-top:12px;font-size:17px;line-height:1.5;min-height:26px;opacity:.85"></div></div>
  </div>

<script>
  const $=id=>document.getElementById(id);
  const api=(p,opts)=>fetch(p,opts).then(r=>r.json());
  const bulbOn=`<svg class="bulb" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 3a9 9 0 0 0-5 16.5V23h10v-3.5A9 9 0 0 0 16 3z"/><path d="M12 27h8M13 30h6"/></svg>`;

  function tick(){
    const d=new Date();
    let h=d.getHours(); const m=String(d.getMinutes()).padStart(2,'0');
    const ap=h<12?'AM':'PM'; let hh=h%12; if(hh===0) hh=12;
    $('clock').innerHTML=`${hh}:${m}<span class="ampm">${ap}</span>`;
    $('date').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
    const g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
    $('greet').textContent=g;
  }

  function renderRooms(rooms){
    $('rooms').innerHTML=rooms.map(r=>`
      <div class="room ${r.on?'on':''}" data-id="${r.id}">
        ${bulbOn}
        <div><div class="nm">${r.name}</div><div class="state">${r.on?'On':'Off'}</div></div>
      </div>`).join('');
    $('rooms').querySelectorAll('.room').forEach(el=>el.onclick=async()=>{
      el.classList.toggle('on'); // optimistic
      const rooms=await api('/api/kiosk/rooms/'+el.dataset.id+'/toggle',{method:'POST'});
      renderRooms(rooms);
    });
  }

  function renderStrip(s){
    const icons={server:`<path d="M4 6h24v7H4zM4 19h24v7H4z"/><circle cx="9" cy="9.5" r="1"/><circle cx="9" cy="22.5" r="1"/>`,
      dev:`<path d="M4 8h24v16H4z"/><path d="M4 13h24"/><circle cx="8" cy="10.5" r="1"/>`,
      app:`<rect x="5" y="5" width="9" height="9"/><rect x="18" y="5" width="9" height="9"/><rect x="5" y="18" width="9" height="9"/><rect x="18" y="18" width="9" height="9"/>`,
      ai:`<path d="M16 4v6M16 22v6M4 16h6M22 16h6"/><rect x="11" y="11" width="10" height="10" rx="2"/>`};
    $('strip').innerHTML=`
      <div class="stat ok"><svg class="ic" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2">${icons.server}</svg><div><div class="v">Online</div><div class="k">${s.node}</div></div></div>
      <div class="stat"><svg class="ic" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2">${icons.dev}</svg><div><div class="v">${s.devices.online}/${s.devices.total}</div><div class="k">Devices online</div></div></div>
      <div class="stat warm"><svg class="ic" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2">${icons.app}</svg><div><div class="v">${s.apps}</div><div class="k">Apps available</div></div></div>
      <div class="stat pur"><svg class="ic" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2">${icons.ai}</svg><div><div class="v">${s.devteam.shipped}</div><div class="k">AI updates shipped</div></div></div>`;
  }

  async function refresh(){
    try{
      const [id,summary,rooms]=await Promise.all([api('/api/identity'),api('/api/kiosk/summary'),api('/api/kiosk/rooms')]);
      $('node').textContent=id.node; $('sub').textContent='The '+id.node+' L.A.B';
      $('dot').style.background='var(--ok)';
      renderStrip(summary); renderRooms(rooms);
    }catch(e){ $('node').textContent='offline'; $('dot').style.background='#c0392b'; }
  }

  // the family surface: the merged calendar (family + shared feeds) and who chose to share their week
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const KC={Gaming:'#ff9e6b',Work:'#9a86ff',Creativity:'#ffcf6f',Browsing:'#6fb4ff',Comms:'#7ee2b8',Entertainment:'#ff7bb0',Other:'#98a1ba'};
  const hm=m=>m>=60?Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m':m+'m';
  async function refreshFamily(){
    const today=new Date().toLocaleDateString('en-CA'), to=new Date(Date.now()+7*86400000).toLocaleDateString('en-CA'), tomorrow=new Date(Date.now()+86400000).toLocaleDateString('en-CA');
    const ev=await api(`/api/calendar/events?from=${today}&to=${to}`).catch(()=>[]);
    $('k-up').innerHTML=ev.length?ev.slice(0,7).map(e=>`<div class="kev"><span class="d">${e.day===today?'Today':e.day===tomorrow?'Tomorrow':new Date(e.day+'T12:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric'})}${e.at_time?' '+esc(e.at_time):''}</span><span><i style="background:${esc(e.color||'#ff9e6b')}"></i>${esc(e.title)}</span></div>`).join(''):'<div class="kempty">Nothing on for the week.</div>';
    const fam=await api('/api/family/stats').catch(()=>[]);
    $('k-week').innerHTML=fam.length?fam.map(m=>{const av=m.avatar||{};const cats=Object.entries(m.cats).sort((a,b)=>b[1]-a[1]);return `<div class="kmem"><div class="av" style="background:${esc(av.color||'#9a86ff')}">${esc(av.emoji||'🙂')}</div><div style="flex:1;min-width:0"><div>${esc(m.name)} <span style="opacity:.6">· ${hm(m.total)}</span></div><div class="bar">${cats.map(([k,v])=>`<i style="width:${(100*v/m.total).toFixed(1)}%;background:${KC[k]||KC.Other}"></i>`).join('')}</div></div></div>`;}).join(''):'<div class="kempty">Nobody is sharing yet — Profile → "What the family can see" in the app.</div>';
  }

  $('k-sq').onsubmit=async e=>{
    e.preventDefault(); const t=$('k-sqin').value.trim(); if(!t) return; $('k-sqin').value=''; $('k-sqout').textContent='…';
    try{ const r=await api('/api/sauce/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'the kiosk',message:t,history:[]})});
      $('k-sqout').innerHTML=esc(r.reply).replace(/\n/g,'<br>')+(r.did&&r.did.length?`<div style="margin-top:6px;font-size:13px;color:#9a86ff">⚡ ${r.did.map(esc).join(' · ')}</div>`:'');
      if(r.did&&r.did.length){ refresh(); refreshFamily(); }
    }catch{ $('k-sqout').textContent='The Sauce is out of reach right now.'; }
  };

  tick(); setInterval(tick,1000);
  refresh(); setInterval(refresh,10000);
  refreshFamily(); setInterval(refreshFamily,60000);
</script>
</body>
</html>
