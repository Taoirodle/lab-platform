<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L.A.B ONE · Director</title>
<style>
  :root{--bg:#0a0c14;--panel:rgba(255,255,255,.05);--stroke:rgba(255,255,255,.1);--txt:#eef1f8;--txt2:#9aa4bd;--a1:#b79bff;--a2:#6fb4ff;--red:#ff5a52;--warm:#ffcf6f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",Inter,system-ui,sans-serif;padding:20px;max-width:560px;margin:0 auto}
  h1{font-size:20px;letter-spacing:2px;margin-bottom:2px}h1 b{color:var(--warm)}
  .sub{color:var(--txt2);font-size:13px;margin-bottom:18px}
  .now{font-family:monospace;font-size:12px;color:var(--a1);margin-bottom:16px;min-height:16px}
  label{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt2);margin:14px 0 6px}
  input{width:100%;padding:12px 14px;background:rgba(0,0,0,.25);border:1px solid var(--stroke);border-radius:12px;color:var(--txt);font:inherit;font-size:15px;margin-bottom:4px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .cue{appearance:none;border:1px solid var(--stroke);background:var(--panel);color:var(--txt);font:inherit;font-size:15px;font-weight:700;padding:18px 14px;border-radius:16px;cursor:pointer;text-align:left;line-height:1.2}
  .cue small{display:block;font-weight:400;font-size:11px;color:var(--txt2);margin-top:4px}
  .cue:active{transform:scale(.97)}
  .cue.big{grid-column:1/-1;background:linear-gradient(135deg,var(--a1),var(--a2));color:#0a0c14;border:0}
  .cue.big small{color:#0a0c1499}
  .cue.red{border-color:var(--red);color:var(--red)}
  .cue.warm{border-color:var(--warm);color:var(--warm)}
  .seq{display:flex;gap:8px;margin-top:16px}
  .seq button{flex:1;border:1px solid var(--stroke);background:var(--panel);color:var(--txt2);border-radius:10px;padding:9px;font:inherit;font-size:12px;cursor:pointer}
</style>
</head>
<body>
  <h1>L<b>.</b>A<b>.</b>B ONE · Director</h1>
  <div class="sub">Fire cues at the TV. Lights follow automatically.</div>
  <div class="now" id="now">ready</div>

  <label>Names (comma separated — for greet + curtain)</label>
  <input id="names" placeholder="Mom, Dad, [Brother]" value="Mom, Dad, [Brother]">
  <label>Joining now (for the onboarding cue)</label>
  <input id="joiner" placeholder="Mom">

  <div class="row">
    <button class="cue big" data-cue="intro">▶ Open the show<small>Cube + "The home, handled."</small></button>
    <button class="cue" data-cue="greet" data-names>Greet the family<small>By name, one by one</small></button>
    <button class="cue red" data-cue="motion">Motion reveal<small>Flash + "the house noticed"</small></button>
    <button class="cue" data-cue="guardian" style="border-color:#5fe08a;color:#5fe08a">Guardian<small>Perimeter secure</small></button>
    <button class="cue warm" data-cue="sauce">The Sauce<small>"Movie night." Lights dim.</small></button>
    <button class="cue" data-cue="money" style="border-color:#5fe08a;color:#5fe08a">The money slide<small>Subscriptions replaced</small></button>
    <button class="cue big" data-cue="join" data-joiner>➕ Onboard someone<small>"{name} has joined"</small></button>
    <button class="cue warm" data-cue="curtain" data-names>Curtain call<small>All names + welcome</small></button>
  </div>
  <div class="seq">
    <button data-cue="idle">↺ Idle</button>
    <button data-cue="blackout">⏻ Blackout</button>
  </div>

<script>
  const $=id=>document.getElementById(id);
  async function fire(cue,data){
    $('now').textContent='▶ '+cue+(data&&data.name?' · '+data.name:'');
    try{ await fetch('/api/showcase/cue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cue,data:data||{}})}); }
    catch(e){ $('now').textContent='✗ '+e.message; }
  }
  document.querySelectorAll('.cue,[data-cue]').forEach(b=>b.onclick=()=>{
    const cue=b.dataset.cue, data={};
    if('names' in b.dataset) data.names=$('names').value.split(',').map(s=>s.trim()).filter(Boolean);
    if('joiner' in b.dataset) data.name=$('joiner').value.trim()||'Someone';
    fire(cue,data);
  });
</script>
</body>
</html>
