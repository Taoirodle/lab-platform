# ============================================================
#  Build the L.A.B Hub native app for Windows, macOS and Linux.
#  This is the correct way to produce all three binaries — including macOS,
#  which cannot be built off the Linux server. Free GitHub-hosted runners do it.
#  On success, the compiled installers are uploaded as build artifacts; drop
#  them into lab-hub-manager/app-builds/ on the server and the "Get the App"
#  page serves real downloads.
# ============================================================
name: build-lab-hub-app
on:
  workflow_dispatch: {}
  push:
    tags: ['app-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # Pinned to 22.04 on purpose: libappindicator3-dev vanished in 24.04, and an
          # AppImage linked against the older glibc runs on every newer distro.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: lab-hub-app
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps (webkit2gtk)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: lab-hub-app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build (tauri)
        run: npx tauri build --target ${{ matrix.target }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: lab-hub-${{ matrix.target }}
          if-no-files-found: error
          path: |
            lab-hub-app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            lab-hub-app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            lab-hub-app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            lab-hub-app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            lab-hub-app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            lab-hub-app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            lab-hub-app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm

  # On a tag, publish every installer to a GitHub Release. The server then pulls
  # them into app-builds/ on its own (POST /api/app/sync, also every 6 h), so
  # "Get the App" serves real Mac/Linux downloads with no manual copying.
  release:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: find artifacts -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          name: L.A.B Hub ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
