[package]
name = "lab-hub"
version = "0.1.0"
description = "L.A.B Hub — the personal, modular home platform app"
authors = ["Volkwyn L.A.B"]
edition = "2021"
license = "GPL-3.0-or-later"

# The library the binary calls into (keeps main.rs tiny, mobile-ready).
[lib]
name = "lab_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"

[profile.release]
opt-level = "s"     # small binary
lto = true
strip = true
