[package]
name = "lab-hub"
version = "0.2.5"
description = "L.A.B Hub — the personal, modular home platform app"
authors = ["Volkwyn L.A.B"]
edition = "2021"
license = "GPL-3.0-or-later"

# The library the binary calls into (keeps main.rs tiny, mobile-ready).
[lib]
name = "lab_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"

# Windows-only: foreground window + last-input time for the Stats sampler.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = "s"     # small binary
lto = true
strip = true
