<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L.A.B Hub</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="shell">
    <aside id="sidebar">
      <div class="brand">
        <div class="logo"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="24" height="24" rx="3"/><rect x="11" y="11" width="10" height="10"/></svg></div>
        <div class="bname">L.A.B</div>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot" id="side-foot">v0.2.4</div>
    </aside>
    <div id="content"><div id="netbar" class="netbar" hidden></div><main id="main"></main></div>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="pages.js"></script>
  <!-- feature modules: each one registers itself; drop a file in, it's in the app -->
  <script src="modules/telemetry.js"></script>
  <script src="modules/charts.js"></script>
  <script src="modules/stats.js"></script>
  <script src="modules/widgets.js"></script>
  <script src="modules/dashboard.js"></script>
  <script src="modules/calendar.js"></script>
  <script src="modules/profile.js"></script>
  <script src="modules/appstore.js"></script>
  <script src="modules/foryou.js"></script>
  <script src="modules/settings.js"></script>
  <script src="modules/notify.js"></script>
  <script src="modules/genpages.js"></script>
  <script src="modules/palette.js"></script>
  <script src="modules/live.js"></script>
  <script>LAB.boot().then(() => { LAB.telemetry.start(); LAB.notify.start(); if (LAB.live) LAB.live.start(); });</script>
</body>
</html>
